<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AD Group User Compare</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="app-header">
    <div>
      <div class="app-title-row">
        <h1>AD Group User Compare</h1>
        <span id="appVersion" class="app-version">Version wird geladen...</span>
      </div>
      <p id="connectionSummary">LDAP-Konfiguration wird geladen...</p>
    </div>
    <button id="themeButton" class="icon-button" type="button" title="Theme umschalten" aria-label="Theme umschalten">◐</button>
  </header>

  <main>
    <section class="query-band">
      <form id="searchForm" class="query-grid">
        <label>
          <span>Gruppenmuster</span>
          <div class="input-action">
            <input id="groupPattern" name="groupPattern" autocomplete="off" placeholder="abc*_1a*" required>
            <button id="clearGroupPatternButton" class="field-clear-button" type="button" title="Gruppenmuster leeren" aria-label="Gruppenmuster leeren" disabled>×</button>
          </div>
        </label>
        <datalist id="groupPatternOptions"></datalist>
        <label>
          <span>Vorherige Muster</span>
          <select id="groupPatternHistory" disabled>
            <option value="">Keine Muster gespeichert</option>
          </select>
        </label>
        <label>
          <span>SearchBase</span>
          <input id="searchBase" name="searchBase" autocomplete="off" placeholder="OU=Groups,DC=example,DC=local">
        </label>
        <label>
          <span>LDAP-Server / URL</span>
          <input id="server" name="server" autocomplete="off" placeholder="ldaps://dc01.example.local:636">
        </label>
        <label class="check-row">
          <input id="onlyEnabled" name="onlyEnabled" type="checkbox" checked>
          <span>Nur aktive Benutzer</span>
        </label>
        <button id="searchButton" type="submit">Suchen</button>
        <button id="deleteGroupPatternButton" type="button" disabled>Muster löschen</button>
        <button id="testLdapButton" type="button">LDAP testen</button>
      </form>
    </section>

    <section class="toolbar">
      <div class="summary" id="summary">Keine Daten geladen</div>
      <label class="filter-box">
        <span>Filter</span>
        <div class="input-action">
          <input id="filterInput" autocomplete="off">
          <button id="clearFilterButton" class="field-clear-button" type="button" title="Filter leeren" aria-label="Filter leeren" disabled>×</button>
        </div>
      </label>
      <button id="copyGroupsButton" type="button" disabled>Gruppen kopieren</button>
      <button id="exportButton" type="button" disabled>CSV exportieren</button>
    </section>

    <section class="compare-panel">
      <label class="user-field user-field-a">
        <span>User 1</span>
        <input id="userA" list="userOptions" autocomplete="off">
      </label>
      <label class="user-field user-field-b">
        <span>User 2</span>
        <input id="userB" list="userOptions" autocomplete="off">
      </label>
      <datalist id="userOptions"></datalist>
      <button id="compareButton" type="button" disabled>User vergleichen</button>
      <button id="clearCompareButton" type="button" disabled>Vergleich schließen</button>
    </section>

    <section class="table-wrap">
      <table id="resultsTable">
        <thead>
          <tr>
            <th>GroupName</th>
            <th>GroupPath</th>
            <th>SamAccountName</th>
            <th>DisplayName</th>
            <th>Mail</th>
            <th>Enabled</th>
            <th>Department</th>
            <th>Title</th>
            <th>DistinguishedName</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <dialog id="ldapTestDialog" class="test-dialog">
    <form method="dialog" class="dialog-shell">
      <header class="dialog-header">
        <h2>LDAP-Test</h2>
        <button id="closeLdapTestButton" class="icon-button" type="submit" aria-label="Schließen">×</button>
      </header>
      <div class="test-config settings-grid" id="ldapTestConfig">
        <label>
          <span>LDAP-Server / URL</span>
          <input id="ldapServerInput" autocomplete="off" placeholder="ldaps://dc01.example.local:636">
        </label>
        <label>
          <span>Port</span>
          <input id="ldapPortInput" type="number" min="1" max="65535" step="1" inputmode="numeric">
        </label>
        <label class="check-row">
          <input id="ldapUseSslInput" type="checkbox">
          <span>LDAPS / SSL</span>
        </label>
        <label class="check-row">
          <input id="ldapUseStartTlsInput" type="checkbox">
          <span>StartTLS</span>
        </label>
        <label class="check-row">
          <input id="ldapVerifyCertificateInput" type="checkbox">
          <span>Zertifikat prüfen</span>
        </label>
        <label>
          <span>SearchBase</span>
          <input id="ldapSearchBaseInput" autocomplete="off" placeholder="OU=Groups,DC=example,DC=local">
        </label>
        <label>
          <span>Gruppenmuster</span>
          <input id="ldapGroupPatternInput" autocomplete="off" placeholder="abc*_1a*">
        </label>
        <label>
          <span>Bind-DN</span>
          <input id="ldapBindDnInput" autocomplete="off" placeholder="CN=ldap-reader,OU=Service Accounts,DC=example,DC=local">
        </label>
        <label>
          <span>Bind-Passwort</span>
          <input id="ldapBindPasswordInput" type="password" autocomplete="new-password">
        </label>
        <label class="check-row">
          <input id="ldapClearPasswordInput" type="checkbox">
          <span>Passwort löschen</span>
        </label>
        <label class="check-row">
          <input id="ldapUsePagingInput" type="checkbox">
          <span>Paging nutzen</span>
        </label>
      </div>
      <div class="test-results" id="ldapTestResults"></div>
      <footer class="dialog-actions">
        <button id="runLdapTestButton" type="button">Test starten</button>
        <button id="saveLdapSettingsButton" type="button">Einstellungen speichern</button>
        <button type="submit">Schließen</button>
      </footer>
    </form>
  </dialog>

  <dialog id="copyGroupsDialog" class="test-dialog">
    <form method="dialog" class="dialog-shell">
      <header class="dialog-header">
        <h2>Gruppen kopieren</h2>
        <button class="icon-button" type="submit" aria-label="Schließen">×</button>
      </header>
      <textarea id="copyGroupsText" class="copy-text" readonly></textarea>
      <footer class="dialog-actions">
        <button type="submit">Schließen</button>
      </footer>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
